# CI: module integrity, format, vet, static analysis, vulnerability scan,
# race-enabled tests, fuzz smoke runs, REUSE licensing, and golden-file schema
# validation.
#
# Third-party actions are pinned to full commit SHAs (the tag is in the
# comment) so a moved or compromised tag cannot change what runs here.
# Dependabot (.github/dependabot.yml) proposes updates to these pins.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read   # least-privilege: CI only reads the repo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false keeps the job token out of .git/config,
      # since no later step needs to push.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # go-version-file means CI always uses the same Go version declared in
      # go.mod, so there's no second place to keep it in sync.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # Checks that downloaded modules match go.sum.
      - name: go mod verify
        run: go mod verify

      # gofmt -l prints files that aren't formatted; "test -z" fails the step
      # if there are any.  This catches style drift before review.
      - name: gofmt
        run: test -z "$(gofmt -l .)"

      # Bidirectional control characters can make source read differently
      # from how it compiles or renders ("Trojan Source", CVE-2021-42574).
      # Fail if any tracked text file contains U+202A-U+202E or
      # U+2066-U+2069. The pattern matches their UTF-8 bytes (E2 80 AA-AE,
      # E2 81 A6-A9), so it needs no PCRE support; -I skips binary files.
      # Write such characters as escapes (\u202e) where they are needed.
      - name: no bidi control characters
        run: |
          set +e
          LC_ALL=C git grep -nIE $'\xe2\x80[\xaa-\xae]|\xe2\x81[\xa6-\xa9]' -- .
          rc=$?
          set -e
          case $rc in
            0) echo "::error::bidi control characters (U+202A-U+202E, U+2066-U+2069) in the lines above"; exit 1 ;;
            1) echo "no bidi control characters in tracked files" ;;
            *) echo "::error::git grep failed with status $rc"; exit 1 ;;
          esac

      # go vet catches common correctness mistakes the compiler doesn't (e.g.
      # mismatched Printf format verbs, unreachable code, suspicious lock copies).
      - name: vet
        run: go vet ./...

      # Tools run at pinned versions through go run, so nothing is installed
      # and the version is reproducible. staticcheck v0.8.2 is release 2026.2.2.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      # Reports known vulnerabilities only in code the module actually calls.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      # -race enables the Go race detector.  It slows tests ~5x but catches
      # data races that only show up under concurrent execution.
      - name: test
        run: go test -race ./...

      # Short fuzz smoke run: replays the seed corpus and mutates for 20 s to
      # catch panics or hangs on malformed input.  Run longer locally with
      # -fuzztime=60s or more when changing the lexer.
      - name: fuzz lexer
        run: go test -run='^$' -fuzz=FuzzLexer -fuzztime=20s ./pkg/fortios/lexer/

      # go test -fuzz accepts one package per run, so each target has its own step.
      - name: fuzz tree
        run: go test -run='^$' -fuzz=FuzzParse -fuzztime=20s ./pkg/fortios/tree/

      - name: fuzz certificate extractor
        run: go test -run='^$' -fuzz='^FuzzExtract$' -fuzztime=20s ./pkg/fortios/extract/certs/

      - name: fuzz certificate field scanner
        run: go test -run='^$' -fuzz='^FuzzScanCertField$' -fuzztime=20s ./pkg/fortios/extract/certs/

      # Every file must have a license and copyright (REUSE spec 3.x).
      - name: reuse lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

      # Download cyclonedx-cli and validate every golden file in pkg/testdata/golden/
      # against the official CycloneDX 1.6 JSON schema.  This catches emitter bugs
      # that our own assertions might miss (e.g. a required field going missing).
      # The SHA-256 is verified before chmod+x so a tampered binary is rejected
      # before it can execute. -f makes an HTTP error fail here instead of saving
      # an error page that only the checksum would catch.
      - name: validate golden files
        run: |
          curl -fsSL --retry 3 https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64 \
            -o /usr/local/bin/cyclonedx-cli
          echo "bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746  /usr/local/bin/cyclonedx-cli" \
            | sha256sum --check --strict
          chmod +x /usr/local/bin/cyclonedx-cli
          find pkg/testdata/golden -name '*.cdx.json' -print0 \
            | xargs -0 -I{} cyclonedx-cli validate \
                --input-file {} \
                --input-format json \
                --input-version v1_6
