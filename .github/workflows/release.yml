# Release: on a v* tag, run the tests in a read-only job, check
# that the tagged commit is on main, then build and publish a draft GitHub
# release with GoReleaser (.goreleaser.yaml): binaries for Linux, macOS, and
# Windows on amd64 and arm64, checksums.txt, a CycloneDX SBOM per archive,
# a Sigstore keyless signature of checksums.txt
# (checksums.txt.sigstore.json), and a build provenance attestation for every
# file it lists. The release notes are the tag's section of CHANGELOG.md.
# Publish the draft by hand after checking it.
#
# Verify a release as README.md shows (cosign verify-blob with this
# workflow's identity: .github/workflows/release.yml@refs/tags/<tag>).
#
# Third-party actions are pinned to full commit SHAs, tags in comments, as in
# ci.yml; Dependabot proposes updates.
name: release

on:
  push:
    tags: ["v*"]

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

jobs:
  # The tests run in a job whose token can only read the repository (enough
  # for checkout, also while the repository is private), so test code never
  # runs with write access.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      # Never release code that fails its tests (CI ran them on the commit,
      # but the tag could point anywhere).
      - name: test
        run: go test -race ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and upload its files
      id-token: write # OIDC token for Sigstore keyless signing and the provenance attestation
      attestations: write # store the build provenance attestation
    steps:
      # fetch-depth 0: GoReleaser reads the tags and the commit history, and
      # the next step needs origin/main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only release commits that are on main: a tag pushed on a side branch
      # or an unmerged commit is refused.
      - name: tagged commit is on main
        run: |
          tagged="$(git rev-parse "${GITHUB_REF}^{commit}")"
          git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null \
            || { echo "::error::origin/main is not available in the checkout"; exit 1; }
          git merge-base --is-ancestor "$tagged" refs/remotes/origin/main \
            || { echo "::error::${GITHUB_REF_NAME} (${tagged}) is not an ancestor of origin/main"; exit 1; }

      # No module cache in the release job, so nothing restored from another
      # workflow's cache can end up in a release binary.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # GoReleaser runs "syft" for the SBOMs, so put the downloaded binary on
      # PATH.
      - id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1
      - name: put syft on PATH
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: echo "$(dirname "$SYFT_CMD")" >> "$GITHUB_PATH"

      # The release notes are the "## [X.Y.Z]" section of CHANGELOG.md for
      # tag vX.Y.Z. The step fails if the section is missing, empty, or still
      # marked Unreleased, so the changelog is dated before a release.
      - name: release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          heading="$(grep -F -m1 "## [${version}]" CHANGELOG.md || true)"
          case "$heading" in
            "") echo "::error::CHANGELOG.md has no section for ${version}"; exit 1 ;;
            *Unreleased*) echo "::error::CHANGELOG.md still marks ${version} as Unreleased; set the release date first"; exit 1 ;;
          esac
          awk -v h="## [${version}]" '
            index($0, h) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "::error::the ${version} section of CHANGELOG.md is empty"; exit 1; }

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA build provenance for every file in checksums.txt (archives and
      # SBOMs), signed with Sigstore and stored as GitHub attestations.
      # Verify as README.md shows (gh attestation verify). Attestations need
      # a public repository (or GitHub Enterprise Cloud for a private one).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
